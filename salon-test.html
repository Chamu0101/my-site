<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サロン試作</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .hero {
        height: 100vh;
        background-color: #ccc;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        gap: 20px;
      }
      .hero h1,
      .hero p {
        margin: 0;
        max-width: 600px;
      }
      .btn {
        background-color: #c08a85; /* 背景の色 */
        color: #fff; /* 文字の色 */
        padding: 14px 32px; /* 内側の余白 → これがボタンの大きさを作る */
        text-decoration: none; /* リンクの下線を消す */
        border-radius: 999px; /* 角を丸くする */
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>miliy nail</h1>
      <p>上尾市のネイルサロン</p>
      <a href="#" class="btn">ご予約はこちら</a>
    </div>
  </body>
</html>
