<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サロンHP練習</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .hero {
        background-color: #ccc;
        height: 100vh;

        display: flex;
        flex-direction: column;
        text-align: center;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      .btn {
        background-color: #c08a85;
        color: white;
        padding: 14px 32px;
        text-decoration: none;
        border-radius: 900px;
      }
      .about {
        padding: 60px 20px;
        text-align: center;
      }
      .cards {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .card {
        background-color: white;
        padding: 20px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>miliy nail</h1>
      <p>上尾市のネイルサロン</p>
      <a href="#" class="btn">ご予約はこちら</a>
    </div>
    <section class="about">
      <h2>当サロンについて</h2>
      <div class="cards">
        <p class="card">仕切りのある完全個室</p>
        <p class="card">駐車場1台あり</p>
        <p class="card">他のお客様と会いません</p>
      </div>
    </section>
  </body>
</html>
